name: Syntax Check
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files
        run: |
          python -m compileall -q . || { echo "::error::Syntax error — do NOT let Blueprint pull this commit"; exit 1; }
